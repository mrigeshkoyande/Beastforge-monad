version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monad-hunt-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_MONAD_CHAIN_ID=10143
      - NEXT_PUBLIC_MONAD_RPC_URL=https://testnet-rpc.monad.xyz/
      - NEXT_PUBLIC_MONAD_EXPLORER_URL=https://testnet.monadexplorer.com
      - NEXT_PUBLIC_HUNT_CORE_ADDRESS=0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0
      - NEXT_PUBLIC_BEAST_NFT_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
      - NEXT_PUBLIC_RESOLVER_ADDRESS=0xa0Ee7A142d267C1f36714E4a8F75612F20a79720
    restart: unless-stopped
