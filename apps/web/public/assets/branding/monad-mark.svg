<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <linearGradient id="monad-red-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D5B" />
      <stop offset="50%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#8B1E2D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer White/Silver "M" Wings -->
  <polygon points="50,28 32,8 8,72 22,66 33,26 50,44 67,26 78,66 92,72 68,8" fill="#FFFFFF" />
  
  <!-- Red Accents on Wings -->
  <polygon points="8,72 16,48 22,66" fill="url(#monad-red-grad)" />
  <polygon points="92,72 84,48 78,66" fill="url(#monad-red-grad)" />

  <!-- Inner Center Sharp Triple Crimson Fangs -->
  <polygon points="40,36 45,36 47,68 42,66" fill="url(#monad-red-grad)" filter="url(#glow)" />
  <polygon points="47,38 53,38 50,78" fill="#E63946" filter="url(#glow)" />
  <polygon points="55,36 60,36 58,66 53,68" fill="url(#monad-red-grad)" filter="url(#glow)" />
</svg>
